# Opciones que Itzli deja marcadas en el instalador del escritorio base
# (proyecto KooL / LinuxBeginnings). Es la instalación "recortada":
# lo necesario para un escritorio completo, sin los extras.
# Puedes cambiar cualquier ON/OFF antes de instalar.

sddm="ON"          # pantalla gráfica de inicio de sesión
sddm_theme="ON"    # su tema de inicio; Itzli le pone encima fondo y colores propios
gtk_themes="ON"    # temas claro/oscuro para las aplicaciones
thunar="ON"        # explorador de archivos
bluetooth="ON"     # útil en portátiles; en una máquina virtual no estorba
input_group="ON"   # lo pide la barra para mostrar el estado del teclado
dots="ON"          # la configuración del escritorio. Sin esto no hay escritorio.

zsh="OFF"          # otra terminal con adornos: no hace falta
pokemon="OFF"      # dibujos en la terminal
rog="OFF"          # solo para portátiles Asus ROG
ags="OFF"          # vista general alternativa; ya viene otra incluida
nvidia="OFF"       # márcalo en el menú si tu equipo tiene tarjeta NVIDIA
nouveau="OFF"
