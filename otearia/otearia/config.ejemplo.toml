# Configuración de Otearia. Vive en ~/.config/otearia/config.toml
# Después de cambiar el intervalo ejecuta:  otearia programar

[general]
intervalo_minutos = 30   # cada cuánto se actualiza sola: 15, 30 o 60
forma = "barra"          # "barra" (módulo arriba + ventana), "panel" (fijo a la derecha) o "ambas"
dias_guardados = 30      # las noticias más viejas se borran, salvo tus favoritas
max_traducciones = 60    # tope por actualización, para que el traductor gratuito no te bloquee

[alertas]
# Te llega una notificación si una noticia menciona alguna de estas palabras.
# Ejemplo: palabras = ["Fortinet", "nombre de mi empresa", "PostgreSQL"]
palabras = []
cve_criticas = true      # avisar cuando aparezca una vulnerabilidad crítica
puntuacion_minima = 9.0  # de 0 a 10; 9 o más se considera crítica

[cve]
dias = 3                 # cuántos días hacia atrás se consultan en la base NVD

[resumen_ia]
# Opcional. Si dejas url y modelo vacíos, la app funciona igual pero sin el
# botón "Resumir". Sirve cualquier servicio compatible con el formato de OpenAI.
#   Servicio en la nube:  url = la dirección base que indique tu proveedor (suele acabar en /v1)
#   Modelo local (Ollama): url = "http://localhost:11434/v1"  y la clave vacía
# Ojo: al resumir, el texto de la noticia se envía a ese servicio.
url = ""
modelo = ""              # el nombre exacto del modelo según tu proveedor
clave = ""               # la clave de API; se queda solo en este archivo

# --- Fuentes -----------------------------------------------------------------
